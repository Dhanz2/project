services:
  - type: web
    name: campus-traffic-safety
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: APP_DATA_DIR
        value: /var/data
      - key: YOLO_CONFIG_DIR
        value: /var/data/ultralytics
      - key: SAFETY_ADMIN_PASSWORD
        generateValue: true
    disk:
      name: campus-safety-data
      mountPath: /var/data
      sizeGB: 5

